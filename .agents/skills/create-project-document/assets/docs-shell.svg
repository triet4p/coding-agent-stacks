<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 850" role="img" aria-labelledby="title description">
  <title id="title">Documentation shell: landing, article and mobile</title>
  <desc id="description">Editable light-theme wireframe. A shared neutral canvas, modest headings, two landing links and an indented sidebar distinguish content from navigation. The mobile task begins without a hero or table of contents.</desc>
  <style>
    text { font: 14px system-ui, "Segoe UI", sans-serif; fill: #24292f; }
    .frame { fill: #ffffff; stroke: #d0d7de; }
    .rule { fill: none; stroke: #d0d7de; }
    .surface { fill: #f4f6f8; }
    .accent { fill: #1757a0; }
    .muted { fill: #57606a; }
    .small { font-size: 12px; }
    .label { font-size: 12px; font-weight: 600; fill: #57606a; }
    .nav { font-size: 13px; }
    .active { fill: #1757a0; font-weight: 600; }
    .brand, .section { font-weight: 600; }
    .section { font-size: 18px; }
    .landing-title { font-size: 29px; font-weight: 650; }
    .article-title { font-size: 25px; font-weight: 650; }
    .link { fill: #1757a0; text-decoration: underline; }
    .code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  </style>

  <text class="section" x="20" y="30">Docs shell</text>
  <text class="muted small" x="960" y="29" text-anchor="end">Scaled wireframe · verify real type and contrast in the browser</text>

  <text class="label" x="20" y="64">Landing · two direct starts, no sidebar or TOC</text>
  <g id="landing" transform="translate(20 74)">
    <rect class="frame" width="644" height="300" rx="4"/>
    <path class="rule" d="M0 44H644"/>
    <text class="brand" x="24" y="27">Project docs</text>
    <text class="nav muted" x="620" y="27" text-anchor="end">Search</text>

    <text class="landing-title" x="32" y="94">What the project helps you do</text>
    <text x="32" y="120">Name the reader and the outcome they can expect.</text>

    <path class="rule" d="M32 146H612M32 201H612"/>
    <text class="link" x="32" y="170">Use: Complete the first task →</text>
    <text class="muted small" x="32" y="187">See the result you can expect.</text>
    <text class="link" x="32" y="225">Build: Run from source →</text>
    <text class="muted small" x="32" y="242">Start the project, then trace one flow.</text>
  </g>

  <text class="label" x="684" y="64">Mobile · first step before secondary UI</text>
  <g id="mobile" transform="translate(684 74)">
    <rect class="frame" width="276" height="300" rx="4"/>
    <path class="rule" d="M0 44H276"/>
    <text class="nav" x="16" y="27">Menu</text>
    <text class="brand" x="72" y="27">Project docs</text>
    <text class="muted small" x="16" y="70">Docs / Build</text>
    <text class="article-title" x="16" y="102">Run locally</text>
    <text x="16" y="126">Start a local instance and check</text>
    <text x="16" y="146">that it responds.</text>

    <text class="section" x="16" y="186">1. Check prerequisites</text>
    <text x="16" y="209">List what the reader needs.</text>
    <text class="section" x="16" y="249">2. Start the project</text>
    <rect class="surface" x="16" y="260" width="244" height="28" rx="3"/>
    <text class="code" x="28" y="279">[verified start command]</text>
  </g>

  <text class="label" x="20" y="408">Article · page navigation on the left, heading anchors on the right</text>
  <g id="article" transform="translate(20 418)">
    <rect class="frame" width="940" height="388" rx="4"/>
    <path class="rule" d="M0 44H940M182 44V388"/>
    <text class="brand" x="24" y="27">Project docs</text>
    <text class="nav" x="206" y="27">Use</text>
    <text class="nav active" x="258" y="27">Build</text>
    <rect class="accent" x="258" y="42" width="34" height="2"/>
    <text class="nav muted" x="916" y="27" text-anchor="end">Search</text>

    <g id="sidebar">
      <text class="label" x="20" y="80">Get started</text>
      <rect class="surface" x="24" y="92" width="142" height="28" rx="3"/>
      <rect class="accent" x="24" y="92" width="2" height="28"/>
      <text class="nav active" x="34" y="110">Run locally</text>
      <text class="nav" x="34" y="139">First change</text>
      <text class="label" x="20" y="177">Understand</text>
      <text class="nav" x="34" y="205">System boundaries</text>
      <text class="nav" x="34" y="233">Request flow</text>
      <text class="nav" x="34" y="261">Design decisions</text>
    </g>

    <text class="muted small" x="210" y="80">Docs / Build</text>
    <text class="article-title" x="210" y="115">Run locally</text>
    <text x="210" y="142">Start a local instance and check that it responds.</text>

    <text class="section" x="210" y="186">1. Check prerequisites</text>
    <text x="210" y="209">List what the reader needs.</text>
    <text class="section" x="210" y="251">2. Start the project</text>
    <rect class="surface" x="210" y="262" width="484" height="32" rx="3"/>
    <text class="code" x="222" y="283">[verified start command]</text>
    <text class="section" x="210" y="333">3. Verify the result</text>
    <text x="210" y="356">Show the check and the success signal side by side.</text>

    <g id="toc">
      <text class="label" x="736" y="80">On this page</text>
      <rect class="accent" x="726" y="94" width="2" height="14"/>
      <text class="small active" x="736" y="106">1. Check prerequisites</text>
      <text class="small muted" x="736" y="130">2. Start the project</text>
      <text class="small muted" x="736" y="154">3. Verify the result</text>
    </g>
  </g>

  <text class="muted small" x="20" y="832">Baseline: article H1 28–32px · body 16/25–26px · sidebar children indented 12–16px</text>
</svg>
